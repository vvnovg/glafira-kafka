name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      # Полная отладочная информация в ~15 тестовых бинарниках (каждый с librdkafka и Tauri)
      # переполняет диск раннера; номеров строк в backtrace достаточно.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ветка stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            crates/glafira-mcp -> target
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsecret-1-dev cmake libcurl4-openssl-dev libsasl2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm i18n:check
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: MCP-шлюз (крейт glafira-mcp)
        run: |
          cargo fmt --manifest-path crates/glafira-mcp/Cargo.toml --check
          cargo clippy --manifest-path crates/glafira-mcp/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/glafira-mcp/Cargo.toml
      - name: Лицензии зависимостей (cargo deny, белый список — deny.toml)
        run: |
          cargo deny --version 2>/dev/null | grep -q ' 0\.20\.2$' || cargo install cargo-deny --locked --version 0.20.2 --force
          cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml check licenses
          cargo deny --manifest-path crates/glafira-mcp/Cargo.toml --config deny.toml check licenses
      - name: Kafka
        run: |
          docker compose -f dev/docker-compose.yml up -d
          scripts/wait-kafka.sh
      - name: Тесты Rust (unit + интеграционные)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --tests
        env:
          KE_IT_BOOTSTRAP: localhost:9092
          KE_IT_SASL_BOOTSTRAP: localhost:9094
          KE_IT_MTLS_BOOTSTRAP: localhost:9095

  mcp-catalog-image:
    # Образ сервера-каталога для реестров MCP (Glama): собирается и отвечает на initialize и
    # tools/list по stdio, вызов инструмента — ошибка desktop_app_required.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Собрать образ
        run: docker build -f crates/glafira-mcp/Dockerfile -t glafira-mcp-catalog .
      - name: Проверить ответы по stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_connections","arguments":{}}}' \
            | (cat; sleep 2) | docker run -i --rm glafira-mcp-catalog > out.jsonl
          python3 - <<'PY'
          import json
          r = {m["id"]: m for m in map(json.loads, open("out.jsonl")) if "id" in m}
          assert r[1]["result"]["serverInfo"]["name"] == "glafira-kafka", r[1]
          tools = r[2]["result"]["tools"]
          assert len(tools) >= 19, len(tools)
          assert r[3]["result"]["isError"] is True, r[3]
          assert "desktop_app_required" in r[3]["result"]["content"][0]["text"], r[3]
          print("tools:", len(tools))
          PY

  platforms:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ветка stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            crates/glafira-mcp -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Unit-тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: MCP-шлюз (stdio GUI-процесса, named pipe / Unix socket)
        run: |
          cargo clippy --manifest-path crates/glafira-mcp/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/glafira-mcp/Cargo.toml
