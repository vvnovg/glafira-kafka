[package]
name = "kafka-explorer"
version = "0.2.0"
description = "Glafira for Apache Kafka — desktop-клиент для Apache Kafka"
authors = ["Glafira for Apache Kafka contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kafka_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rdkafka = { version = "0.37", features = ["cmake-build", "ssl-vendored", "libz-static", "zstd"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
serde_json_path = "0.7"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
base64 = "0.22"
csv = "1"
openssl = { version = "0.10", features = ["vendored"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
plist = "1"
license-format = { path = "../crates/license-format" }
glafira-mcp = { path = "../crates/glafira-mcp" }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time", "macros", "sync"] }
dirs = "7"
sys-locale = "0.3"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
license-format = { path = "../crates/license-format", features = ["dev-keys"] }
rmcp = { version = "3.5.1", features = ["client", "transport-async-rw"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
