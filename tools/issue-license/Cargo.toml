[package]
name = "issue-license"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
license-format = { path = "../../crates/license-format" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
